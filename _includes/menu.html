<div class="btn" id="toggle-btn" role="button" tabindex="0"
     aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
  <div id="hamburger">
    <span></span>
  </div>
</div>

<div class="menu-panel" id="site-menu" role="menu" aria-hidden="true">

  <div class="menu-row">
    <span class="menu-row-label">
      <i class="fa-regular fa-moon" aria-hidden="true"></i>
      <span id="theme-label">Dark</span>
    </span>

    <label class="theme-switch" for="theme-toggle">
      <input type="checkbox" id="theme-toggle" role="switch"
             aria-label="Toggle light mode">
      <span class="theme-slider"></span>
    </label>
  </div>

</div>
