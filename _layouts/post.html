---
layout: default
---

<div class="container">

    <div class="go-back" onclick="goBack()">Go Back</div>
    
    <h1>{{ page.title }}</h1>
    
    {{ if page.type == "blog" }}
      <p style="text-align: justify;">{{ page.date | date_to_string }} - {{ page.author }}</p>
    {{ endif }}

    {{ content }}

</div>
