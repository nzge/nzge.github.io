name: Build and Deploy Jekyll Site

# REQUIRES: Settings -> Pages -> Source = "GitHub Actions".
#
# While Source is "Deploy from a branch", GitHub also runs its own built-in
# builder ("pages build and deployment"), and that build is what serves the
# site. It ignores Gemfile, pins its own Jekyll, silently drops
# non-whitelisted plugins (jekyll-contentblocks, jekyll-archives,
# htmlcompressor, htmlbeautifier) and silently adds others. Setting Source to
# "GitHub Actions" disables it and makes this workflow authoritative.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. Nothing pushes to a branch any more, so contents is
# read-only; deploy-pages needs pages:write plus id-token:write for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one mid-rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          # Deliberately NOT `bundler-cache: true`.
          #
          # That flag installs in frozen mode, and Gemfile.lock declares
          # PLATFORMS: x64-mingw-ucrt only -- it was generated on Windows,
          # and pins ffi and nokogiri to -x64-mingw-ucrt builds. On the
          # ubuntu runner (x86_64-linux) frozen resolution fails with
          # Bundler::ProductionError, exit code 16. That is exactly why the
          # generated "Deploy Jekyll site to Pages" workflow failed.
          #
          # To enable caching later, run this locally and commit the result:
          #     bundle lock --add-platform x86_64-linux
          bundler-cache: false

      # Non-frozen install: resolves for the runner's own platform. This is
      # the step that has built this site successfully for 295 runs.
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # No --baseurl override: _config.yml sets baseurl "" and
      # url https://nzge.github.io, which is correct for a user site.
      - name: Build the Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
